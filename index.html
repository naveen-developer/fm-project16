<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | Time tracking dashboard</title>
  <link rel="stylesheet" href="./src/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>

  </style>
</head>

<body>
  <main class="ttd_container">

    <div class="profile">
      <div class="profile_top">
        <img src="./images/image-jeremy.png" alt="Portrait of Jeremy Robson">
        <div>
          <p>Report for</p>
          <h1>Jeremy Robson</h1>
        </div>
      </div>
      <div class="profile_bottom">
        <ul>
          <li>
            <button type="button" class="daily" aria-current="false">Daily</button>
          </li>
          <li>
            <button type="button" class="active weekly" aria-current="true">Weekly</button>
          </li>
          <li>
            <button type="button" class="monthly" aria-current="false">Monthly</button>
          </li>
        </ul>
      </div>
    </div>

    <div class="card work">
      <div class="card_top">
        <img src="./images/icon-work.svg" alt="">
      </div>
      <div class="card_bottom">
        <div class="title">
          <h2>Work</h2>
          <button class="ellipses" aria-label="Open options"><img src="./images/icon-ellipsis.svg" alt=""></button>
        </div>
        <p class="timing">5hrs</p>
        <p class="previous_timing">Yesterday - 7hrs</p>
      </div>
    </div>

    <div class="card play">
      <div class="card_top">
        <img src="./images/icon-play.svg" alt="">
      </div>
      <div class="card_bottom"></div>
    </div>

    <div class="card study">
      <div class="card_top">
        <img src="./images/icon-study.svg" alt="">
      </div>
      <div class="card_bottom"></div>
    </div>

    <div class="card exercise">
      <div class="card_top">
        <img src="./images/icon-exercise.svg" alt="">
      </div>
      <div class="card_bottom"></div>
    </div>

    <div class="card social">
      <div class="card_top">
        <img src="./images/icon-social.svg" alt="">
      </div>
      <div class="card_bottom"></div>
    </div>

    <div class="card selfcare">
      <div class="card_top">
        <img src="./images/icon-self-care.svg" alt="">
      </div>
      <div class="card_bottom"></div>
    </div>

  </main>
  <script src="./src/main.js"></script>

</body>

</html>
